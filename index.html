<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
 
</head>

<body>

    <div class="main_container">

        <header>

            <div class="logo_home_search_bar">
                <img src="temp/Spotify-icon.png" alt="spotify">

                <div class="home_search_bar">
                    <button><img id="home_btn_img" src="temp/home-icon-png.png" alt="home_btn"></button>
                    <input type="search" name="search" id="" placeholder="What do you want to play?">
                </div>
 
            </div>

            <div class="header_options">
                <button id="explore_btn">Explore Premium</button>
                <button id="install_btn">Install App</button>
                <button id="bell_btn"><img id="bell_icon" src="temp/bell_icon.png" alt=""></button>
                <button id="profile_btn"><img ic="profile_pic" src="temp/profile_pic.png" alt=""></button>
            </div>
        </header>

        <main>
            <div class="container">

                <!-----------------------------------------------your_library--->
                <div class="your_library">
                    <div class="your_library_header">
                        <img id="library_icon" src="temp/library_icon.png" alt="">

                        <div class="row_one_header">
                            <img id="collapse_icon" src="temp/collapse_icon.png" alt="">
                            <h1>Your Library</h1>
                            <div class="library_btns">
                                <button>+</button>
                                <button>
                                    <>
                                </button>
                            </div>
                        </div>

                        <div class="row_two_btns">
                            <button id="playlist_btn">Playlists</button>
                            <button id="artist_btn">Artists</button>

                        </div>
                    </div>

                    <div class="your_library_content">
                        <div class="content_heading">
                            <button id="library_search"><img src="temp/search-btn.png" alt="search"></button>
                            <button id="Library_recent">Recents</button>
                        </div>

                        <div class="library_card c1">
                            <img id="your_library_card_pic" src="temp/pic1.avif" alt="pic one">
                            <a href="">
                                <h3>Liked Songs</h3>
                            </a>
                        </div>

                        <div class="library_card c2">
                            <img id="your_library_card_pic" src="temp/pic2.png" alt="pic one">
                            <a href="">
                                <h3>Phonk</h3>
                            </a>
                        </div>

                        <div class="library_card c3">
                            <img id="your_library_card_pic" src="temp/pic3.webp" alt="pic one">
                            <a href="">
                                <h3>ACE</h3>
                            </a>
                        </div>

                        <div class="library_card c4">
                            <img id="your_library_card_pic" src="temp/pic4.webp" alt="pic one">
                            <a href="">
                                <h3>English</h3>
                            </a>
                        </div>

                        <div class="library_card c5">
                            <img id="your_library_card_pic" src="temp/pic5.jpg" alt="pic one">
                            <a href="">
                                <h3>lofi</h3>
                            </a>
                        </div>

                        <div class="library_card c6">
                            <img id="your_library_card_pic" src="temp/pic6.webp" alt="pic one">
                            <a href="">
                                <h3>Hindi</h3>
                            </a>
                        </div>


                    </div>
                </div>

                <!-----------------------------------------------all_section--->
 
                <div class="all_section">
                    <div class="all_section_header">
                        <button id="all-btn">All</button>
                        <button id="music-btn">Music</button>
                        <button id="podcast-btn">Podcast</button>
                    </div>
 
                    <div class="all_section_content">
                        <div class="short_cut">
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>liked songs</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>English</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>Hindi</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>Hip Hop</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>Phonk</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>Gym</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>Ace</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                            <div class="short-cut-card"><div class="short-cut-card-img"></div><p>Lo-Fi</p> <div class="short-cut-play-btn"><img src="temp/play_icon.png" alt=""></div></div>
                        </div>

                        <div class="play_cards">
                           
                        </div>
                    </div>
                </div>

                <!-----------------------------------------------song_info--->
  
                <div class="song_info">c3</div>

            </div>
        </main>

        <div class="play_bar">
            <!-- this is play bar -->
        </div>

    </div>

</body>

</html>
